[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mydre-upload-sdk"
version = "1.0.1"
authors = [{ name = "anDREa Team" }]
description = "Client library for workspace API file uploads."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "azure-storage-blob>=12.0.0",
    "pandas>=1.0.0"
]
